services:
  postgres:
    image: postgres:16-alpine
    container_name: topdevops-mlflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: \${POSTGRES_PASSWORD:-mlflow-local-only}
      POSTGRES_DB: mlflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [mlflow-net]
  mlflow:
    build: .
    container_name: topdevops-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://mlflow:\${POSTGRES_PASSWORD:-mlflow-local-only}@postgres:5432/mlflow
      --serve-artifacts
      --artifacts-destination /mlartifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
    networks: [mlflow-net]
volumes:
  postgres_data:
  mlflow_artifacts:
networks:
  mlflow-net:
    driver: bridge
