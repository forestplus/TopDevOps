name: Upgrade experience cards
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upgrade-experience-cards.yml'
      - 'scripts/exp_b64/**'
      - 'scripts/decode_exp_b64.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and apply
        run: |
          set -euo pipefail
          python3 scripts/decode_exp_b64.py
          python3 scripts/upgrade_experience_cards.py
          grep -q 'NDA (ОАЭ, Дубай)' index.html
      - name: Commit
        run: |
          git config user.name "TopDevOps Bot"
          git config user.email "forestplus@ya.ru"
          git add index.html scripts/upgrade_experience_cards.py
          git commit -m "feat(experience): professional resume-aligned timeline cards (RU/EN)" || exit 0
          git push
