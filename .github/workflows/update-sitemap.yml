name: Update sitemap

# Keeps sitemap.xml in sync with the pages and their last git change date.
on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'scripts/build-sitemap.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sitemap
  cancel-in-progress: false

jobs:
  sitemap:
    name: Rebuild sitemap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build sitemap
        run: node scripts/build-sitemap.mjs

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: refresh sitemap lastmod"
          git push
