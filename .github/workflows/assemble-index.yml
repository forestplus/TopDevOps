name: Restore full index
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assemble-index.yml'
      - 'scripts/patch_index.py'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        run: python3 scripts/patch_index.py

      - name: Build circular avatar from existing photo
        run: |
          python3 << 'PY'
          from pathlib import Path
          try:
              from PIL import Image, ImageDraw, ImageFilter
          except ImportError:
              import subprocess
              subprocess.check_call(['pip', 'install', 'pillow', '-q'])
              from PIL import Image, ImageDraw, ImageFilter

          src_path = Path('IMG_1447.jpeg')
          if not src_path.exists():
              src_path = Path('IMG_1447.jpg')
          if not src_path.exists():
              print('No source photo, skip avatar')
              raise SystemExit(0)

          im = Image.open(src_path).convert('RGBA')
          w, h = im.size
          side = min(w, h)
          left = (w - side) // 2
          top = max(0, (h - side) // 2 - int(side * 0.05))
          im = im.crop((left, top, left + side, top + side)).resize((240, 240), Image.LANCZOS)
          mask = Image.new('L', (240, 240), 0)
          ImageDraw.Draw(mask).ellipse((0, 0, 239, 239), fill=255)
          mask = mask.filter(ImageFilter.GaussianBlur(1))
          out = Image.new('RGBA', (240, 240), (0, 0, 0, 0))
          out.paste(im, (0, 0))
          out.putalpha(mask)
          out.save('photo-avatar-240.png', optimize=True)
          print('avatar written', Path('photo-avatar-240.png').stat().st_size)
          PY

      - name: Commit and push
        run: |
          git config user.name "TopDevOps Bot"
          git config user.email "forestplus@ya.ru"
          git add index.html photo-avatar-240.png || true
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "feat: full homepage — notes search, profile photo, OG cache-buster"
          git push
