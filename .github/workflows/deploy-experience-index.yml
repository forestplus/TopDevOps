name: Deploy experience-updated index
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-experience-index.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore good index.html from known commit
        run: |
          set -euo pipefail
          git show 3303559d3272ec6307f8e3d50b44e5f5a8d02500:index.html > index.html
          wc -c index.html
          grep -c 'timeline-item' index.html || true
          head -c 100 index.html
          grep -q 'DevOps/SRE' index.html
      - name: Commit
        run: |
          git config user.name "TopDevOps Bot"
          git config user.email "forestplus@ya.ru"
          git add index.html
          git status --short | head
          git commit -m "fix: restore index.html from good commit 3303559" || exit 0
          git push
