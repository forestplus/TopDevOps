name: Apply resume button UI
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-resume-btn-ui.yml'
      - 'scripts/apply_resume_btn_ui.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch
        run: |
          set -euo pipefail
          git show 7d2038d1ae4f46416f1fcad5df4c6ffaaf084960:index.html > index.html
          wc -c index.html
          python3 scripts/apply_resume_btn_ui.py
      - name: Commit
        run: |
          git config user.name "TopDevOps Bot"
          git config user.email "forestplus@ya.ru"
          git add index.html
          git diff --staged --stat
          git commit -m "feat(ui): view resume PDF in browser, pulse CTA" || exit 0
          git push
