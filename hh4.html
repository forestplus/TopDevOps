<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR-Собеседование — Первый Бит | Senior System Administrator L3 | Дмитрий Парамонов</title>
<style>
:root{--pri:#1a73e8;--prid:#1557b0;--acc:#ff6d00;--suc:#2e7d32;--wrn:#f57c00;--dng:#c62828;--bg:#f4f6fb;--card:#fff;--txt:#1a1a2e;--mut:#5a6a7a;--brd:#dde3ef;--sw:278px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.65;display:flex;min-height:100vh}
#sb{width:var(--sw);background:linear-gradient(180deg,#0d1b3e,#1a2f6b);color:#fff;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100;padding:22px 0;transition:transform .3s}
#sb::-webkit-scrollbar{width:4px}
#sb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
.sh{padding:0 18px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.sh h2{font-size:14px;font-weight:700}.sh p{font-size:11px;opacity:.6;margin-top:3px}
.ng{font-size:9.5px;text-transform:uppercase;letter-spacing:1.2px;opacity:.4;padding:11px 18px 5px;font-weight:600}
.nl{display:flex;align-items:center;gap:9px;padding:8px 18px;color:rgba(255,255,255,.75);text-decoration:none;font-size:12.5px;transition:all .15s;border-left:3px solid transparent}
.nl:hover{background:rgba(255,255,255,.08);color:#fff}
.nl.ac{background:rgba(255,255,255,.13);color:#fff;border-left-color:var(--acc)}
.nl .ic{font-size:14px;width:18px;text-align:center}
.nl .bd{margin-left:auto;background:var(--acc);color:#fff;font-size:9.5px;padding:1px 6px;border-radius:10px;font-weight:700}
#mn{margin-left:var(--sw);flex:1;padding:30px 38px 60px;max-width:940px}
.hero{background:linear-gradient(135deg,#1a2f6b,#1a73e8 60%,#4fc3f7);color:#fff;border-radius:16px;padding:34px 38px;margin-bottom:30px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:rgba(255,255,255,.07);border-radius:50%}
.hb{display:inline-block;background:rgba(255,255,255,.2);padding:3px 12px;border-radius:20px;font-size:11.5px;font-weight:600;margin-bottom:11px}
.hero h1{font-size:24px;font-weight:800;margin-bottom:7px}.hero>p{opacity:.85;font-size:14.5px}
.hm{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap}
.hi{display:flex;align-items:center;gap:5px;font-size:12.5px;opacity:.9}
.sc{background:var(--card);border-radius:14px;padding:26px 30px;margin-bottom:22px;border:1px solid var(--brd);box-shadow:0 2px 12px rgba(0,0,0,.05)}
.st{font-size:17px;font-weight:700;color:var(--prid);margin-bottom:18px;padding-bottom:11px;border-bottom:2px solid var(--brd);display:flex;align-items:center;gap:9px}
.st .em{font-size:20px}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;margin-bottom:18px}
.ic2{background:var(--bg);border-radius:9px;padding:13px 15px;border-left:3px solid var(--pri)}
.ic2 .lb{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.ic2 .vl{font-size:13.5px;font-weight:600;margin-top:3px}
.mw{margin-bottom:13px}.ml{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.ml span:last-child{font-weight:700}
.mb{height:7px;background:var(--brd);border-radius:4px;overflow:hidden}
.mf{height:100%;border-radius:4px}
.fh{background:linear-gradient(90deg,#43a047,#66bb6a)}.fm{background:linear-gradient(90deg,#f57c00,#ffb74d)}
.qct{font-size:14px;font-weight:700;color:var(--pri);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.qct::after{content:'';flex:1;height:1px;background:var(--brd)}
.qc{background:var(--bg);border-radius:9px;margin-bottom:11px;overflow:hidden;border:1px solid var(--brd);transition:box-shadow .2s}
.qc:hover{box-shadow:0 4px 14px rgba(26,115,232,.1)}
.qq{padding:13px 16px;cursor:pointer;display:flex;align-items:flex-start;gap:11px;user-select:none}
.qq:hover{background:rgba(26,115,232,.04)}
.qn{background:var(--pri);color:#fff;font-size:10.5px;font-weight:700;min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.qt{font-size:13.5px;font-weight:600;flex:1}
.tg{font-size:9.5px;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap;flex-shrink:0}
.tm{background:#fce4ec;color:#c62828}.tl{background:#fff3e0;color:#e65100}.tb{background:#e8f5e9;color:#2e7d32}.tt{background:#f3e5f5;color:#6a1b9a}
.qch{font-size:11px;color:var(--mut);transition:transform .2s;flex-shrink:0;margin-top:3px}
.qc.op .qch{transform:rotate(180deg)}
.qa{display:none;padding:0 16px 15px 50px;font-size:13px;color:#2a3a4a;line-height:1.75}
.qc.op .qa{display:block}
.at{background:#e8f5e9;border-left:3px solid var(--suc);padding:9px 13px;border-radius:0 7px 7px 0;margin-top:9px;font-size:12.5px}
.at strong{color:var(--suc)}
.aw{background:#fff8e1;border-left:3px solid var(--wrn);padding:9px 13px;border-radius:0 7px 7px 0;margin-top:9px;font-size:12.5px}
.aw strong{color:var(--wrn)}
.as{background:#e3f2fd;border-left:3px solid var(--pri);padding:9px 13px;border-radius:0 7px 7px 0;margin-top:9px;font-size:12.5px;font-style:italic}
.as strong{color:var(--pri);font-style:normal}
.cl{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--brd);font-size:13.5px}
.cl:last-child{border-bottom:none}
.ci{width:21px;height:21px;border:2px solid var(--pri);border-radius:5px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s;margin-top:1px}
.ci.ck{background:var(--pri);color:#fff}
.tgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:13px}
.tc{background:var(--bg);border-radius:9px;padding:15px;border-top:3px solid var(--pri)}
.tc.tw{border-top-color:var(--wrn)}.tc.tg2{border-top-color:var(--suc)}.tc.td{border-top-color:var(--dng)}
.tc h4{font-size:12.5px;font-weight:700;margin-bottom:7px}.tc p{font-size:12px;color:var(--mut);line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--pri);color:#fff;padding:9px 13px;text-align:left;font-weight:600}
td{padding:9px 13px;border-bottom:1px solid var(--brd)}
tr:nth-child(even) td{background:var(--bg)}tr:hover td{background:#e8f0fe}
.tl2{position:relative;padding-left:26px}
.tl2::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--brd)}
.ti{position:relative;margin-bottom:18px}
.ti::before{content:'';position:absolute;left:-22px;top:4px;width:11px;height:11px;background:var(--pri);border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px var(--pri)}
.ti .tt2{font-size:10.5px;color:var(--mut);font-weight:600;text-transform:uppercase}
.ti .ev{font-size:13.5px;font-weight:600;margin:2px 0}.ti .ds{font-size:12.5px;color:var(--mut)}
#mt{display:none;position:fixed;top:13px;left:13px;z-index:200;background:var(--pri);color:#fff;border:none;border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer;align-items:center;justify-content:center}
.tt3{display:inline-block;background:#e8f0fe;color:var(--pri);font-size:10.5px;padding:2px 7px;border-radius:4px;font-weight:600;margin:2px}
@media(max-width:768px){#sb{transform:translateX(-100%)}#sb.op{transform:translateX(0)}#mn{margin-left:0;padding:65px 15px 40px}#mt{display:flex}.hero{padding:22px 18px}.hero h1{font-size:19px}.sc{padding:18px 15px}}
@media print{#sb,#mt{display:none!important}#mn{margin-left:0}.qa{display:block!important}}
</style>
</head>
