    <line x1="140" y1="475" x2="160" y2="475" stroke="#7f8c8d" stroke-width="1.5" />
    <line x1="140" y1="505" x2="160" y2="505" stroke="#7f8c8d" stroke-width="1.5" />
    
    <rect x="160" y="465" width="130" height="20" rx="2" fill="#2980b9" />
