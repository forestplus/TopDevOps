  <!-- ПРАВАЯ ЧАСТЬ: Описания -->
  <g transform="translate(530, 200)" font-size="14" fill="#2c3e50">
    
    <!-- CLAUDE.MD -->
    <rect x="0" y="0" width="620" height="75" rx="6" fill="#fff" stroke="#d35400" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="620" height="28" rx="6" fill="#d35400" />
    <rect x="0" y="14" width="620" height="14" fill="#d35400" /> <!-- Прямые углы снизу заголовка -->
    <text x="15" y="19" fill="#fff" font-weight="bold" font-size="15">CLAUDE.MD</text>
    <text x="15" y="48" font-size="13" fill="#2c3e50">✅ Основной файл инструкций, загружаемый при запуске сессии.</text>
    <text x="15" y="65" font-size="13" fill="#2c3e50">✅ Содержит обзор проекта, стек, команды и соглашения.</text>

    <!-- .MCP.JSON -->
    <rect x="0" y="90" width="620" height="75" rx="6" fill="#fff" stroke="#a0522d" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="90" width="620" height="28" rx="6" fill="#a0522d" />
    <rect x="0" y="104" width="620" height="14" fill="#a0522d" />
    <text x="15" y="109" fill="#fff" font-weight="bold" font-size="15">.MCP.JSON</text>
    <text x="15" y="138" font-size="13" fill="#2c3e50">✅ Подключает внешние инструменты, такие как GitHub, JIRA, Slack, БД.</text>
    <text x="15" y="155" font-size="13" fill="#2c3e50">✅ Общая конфигурация интеграции для всей команды.</text>

    <!-- SETTINGS.JSON -->
    <rect x="0" y="180" width="620" height="75" rx="6" fill="#fff" stroke="#d35400" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="180" width="620" height="28" rx="6" fill="#d35400" />
    <rect x="0" y="194" width="620" height="14" fill="#d35400" />
    <text x="15" y="199" fill="#fff" font-weight="bold" font-size="15">SETTINGS.JSON</text>
    <text x="15" y="228" font-size="13" fill="#2c3e50">✅ Управляет правами доступа, моделями, инструментами и хуками.</text>
    <text x="15" y="245" font-size="13" fill="#2c3e50">✅ Общая конфигурация с поддержкой локального переопределения.</text>

    <!-- ПРАВИЛА -->
    <rect x="0" y="270" width="620" height="75" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="270" width="620" height="28" rx="6" fill="#c0392b" />
    <rect x="0" y="284" width="620" height="14" fill="#c0392b" />
    <text x="15" y="289" fill="#fff" font-weight="bold" font-size="15">ПРАВИЛА (RULES/)</text>
    <text x="15" y="318" font-size="13" fill="#2c3e50">✅ Модульные файлы правил для таких тем, как стиль или тестирование.</text>
    <text x="15" y="335" font-size="13" fill="#2c3e50">✅ Могут применять правила только к определенным путям к файлам.</text>

    <!-- КОМАНДЫ -->
    <rect x="0" y="360" width="620" height="75" rx="6" fill="#fff" stroke="#27ae60" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="360" width="620" height="28" rx="6" fill="#27ae60" />
    <rect x="0" y="374" width="620" height="14" fill="#27ae60" />
    <text x="15" y="379" fill="#fff" font-weight="bold" font-size="15">КОМАНДЫ (COMMANDS/)</text>
    <text x="15" y="408" font-size="13" fill="#2c3e50">✅ Пользовательские слэш-команды для повторяющихся рабочих процессов.</text>
    <text x="15" y="425" font-size="13" fill="#2c3e50">✅ Поддерживает выполнение shell-команд и автоматизацию.</text>

    <!-- НАВЫКИ -->
    <rect x="0" y="450" width="620" height="75" rx="6" fill="#fff" stroke="#2980b9" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="450" width="620" height="28" rx="6" fill="#2980b9" />
    <rect x="0" y="464" width="620" height="14" fill="#2980b9" />
    <text x="15" y="469" fill="#fff" font-weight="bold" font-size="15">НАВЫКИ (SKILLS/)</text>
    <text x="15" y="498" font-size="13" fill="#2c3e50">✅ Автоматически загружаемые рабочие процессы на основе сопоставления задач.</text>
    <text x="15" y="515" font-size="13" fill="#2c3e50">✅ Поддерживает контекст легким и релевантным.</text>

    <!-- АГЕНТЫ -->
    <rect x="0" y="540" width="620" height="75" rx="6" fill="#fff" stroke="#d35400" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="540" width="620" height="28" rx="6" fill="#d35400" />
    <rect x="0" y="554" width="620" height="14" fill="#d35400" />
    <text x="15" y="559" fill="#fff" font-weight="bold" font-size="15">АГЕНТЫ (AGENTS/)</text>
    <text x="15" y="588" font-size="13" fill="#2c3e50">✅ Специализированные субагенты с изолированными контекстами.</text>
    <text x="15" y="605" font-size="13" fill="#2c3e50">✅ Используются для сфокусированных задач, таких как ревью или аудит.</text>

    <!-- ХУКИ -->
    <rect x="0" y="630" width="620" height="75" rx="6" fill="#fff" stroke="#27ae60" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="630" width="620" height="28" rx="6" fill="#27ae60" />
    <rect x="0" y="644" width="620" height="14" fill="#27ae60" />
    <text x="15" y="649" fill="#fff" font-weight="bold" font-size="15">ХУКИ (HOOKS/)</text>
    <text x="15" y="678" font-size="13" fill="#2c3e50">✅ Скрипты, управляемые событиями, до/после выполнения инструмента.</text>
    <text x="15" y="695" font-size="13" fill="#2c3e50">✅ Обрабатывает валидацию, линтинг, форматирование или блокирующие действия.</text>

  </g>
</svg>
