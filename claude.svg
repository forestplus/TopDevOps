    <line x1="20" y1="45" x2="40" y2="45" stroke="#7f8c8d" stroke-width="1.5" />
    <line x1="20" y1="75" x2="40" y2="75" stroke="#7f8c8d" stroke-width="1.5" />
    <line x1="20" y1="105" x2="40" y2="105" stroke="#7f8c8d" stroke-width="1.5" />
    <line x1="20" y1="135" x2="40" y2="135" stroke="#7f8c8d" stroke-width="1.5" />
    
    <!-- Файлы в корне -->
    <rect x="40" y="35" width="130" height="22" rx="3" fill="#e67e22" />
