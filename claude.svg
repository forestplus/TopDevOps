    <line x1="100" y1="360" x2="120" y2="360" stroke="#7f8c8d" stroke-width="1.5" />
    <line x1="100" y1="390" x2="120" y2="390" stroke="#7f8c8d" stroke-width="1.5" />
    
    <rect x="120" y="350" width="120" height="20" rx="2" fill="#e67e22" />
