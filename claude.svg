    <rect x="40" y="65" width="150" height="22" rx="3" fill="#e67e22" />
    <text x="50" y="81" fill="#fff" font-size="13">📄 CLAUDE.local.md</text>
    
    <rect x="40" y="95" width="120" height="22" rx="3" fill="#e67e22" />
    <text x="50" y="111" fill="#fff" font-size="13">📄 .mcp.json</text>
    
    <!-- .claude/ -->
    <rect x="40" y="125" width="100" height="22" rx="3" fill="#d35400" />
    <text x="50" y="141" fill="#fff" font-size="13">📁 .claude/</text>
    
    <!-- Вложенные линии .claude -->
    <line x1="60" y1="147" x2="60" y2="700" stroke="#7f8c8d" stroke-width="1.5" />
    <line x1="60" y1="165" x2="80" y2="165" stroke="#7f8c8d" stroke-width="1.5" />
    <line x1="60" y1="195" x2="80" y2="195" stroke="#7f8c8d" stroke-width="1.5" />
    <line x1="60" y1="235" x2="80" y2="235" stroke="#7f8c8d" stroke-width="1.5" />
    <line x1="60" y1="330" x2="80" y2="330" stroke="#7f8c8d" stroke-width="1.5" />
    <line x1="60" y1="415" x2="80" y2="415" stroke="#7f8c8d" stroke-width="1.5" />
    <line x1="60" y1="530" x2="80" y2="530" stroke="#7f8c8d" stroke-width="1.5" />
    <line x1="60" y1="630" x2="80" y2="630" stroke="#7f8c8d" stroke-width="1.5" />

    <!-- settings -->
