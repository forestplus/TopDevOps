    <text x="90" y="536" fill="#fff" font-size="13">📁 агенты/</text>
    
    <line x1="100" y1="542" x2="100" y2="600" stroke="#7f8c8d" stroke-width="1.5" />
    <line x1="100" y1="560" x2="120" y2="560" stroke="#7f8c8d" stroke-width="1.5" />
    <line x1="100" y1="595" x2="120" y2="595" stroke="#7f8c8d" stroke-width="1.5" />
    
    <rect x="120" y="550" width="170" height="20" rx="2" fill="#e67e22" />
