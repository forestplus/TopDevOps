    <rect x="120" y="380" width="160" height="20" rx="2" fill="#e67e22" />
    <text x="130" y="395" fill="#fff" font-size="12">📄 исправить-проблему.md</text>
    
    <!-- Навыки -->
    <rect x="80" y="405" width="100" height="22" rx="3" fill="#2980b9" />
    <text x="90" y="421" fill="#fff" font-size="13">📁 навыки/</text>
    
    <line x1="100" y1="427" x2="100" y2="505" stroke="#7f8c8d" stroke-width="1.5" />
    <line x1="100" y1="445" x2="120" y2="445" stroke="#7f8c8d" stroke-width="1.5" />
    
    <rect x="120" y="435" width="100" height="22" rx="3" fill="#2980b9" />
