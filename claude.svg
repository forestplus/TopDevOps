    <text x="15" y="318" font-size="13" fill="#2c3e50">✅ Модульные файлы правил для таких тем, как стиль кода или тестирование.</text>
    <text x="15" y="335" font-size="13" fill="#2c3e50">✅ Могут применять правила только к определенным путям к файлам.</text>

