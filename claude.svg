  </defs>

  <!-- Заголовки -->
  <text x="40" y="50" font-size="36" font-weight="900" fill="#d35400" letter-spacing="1">* CLAUDE CODE</text>
  <text x="40" y="95" font-size="38" font-weight="900" fill="#2c3e50">СТРУКТУРА ПРОЕКТА</text>
  <text x="510" y="85" font-size="20" font-weight="bold" fill="#7f8c8d">СТРУКТУРА</text>
  <text x="510" y="110" font-size="20" font-weight="bold" fill="#7f8c8d">ПАПОК</text>
  
  <text x="40" y="130" font-size="14" fill="#7f8c8d">Ваасанкар Натараджан</text>
  <text x="40" y="150" font-size="12" fill="#95a5a6" font-style="italic">Достигая лучших результатов с помощью ИИ, облачных технологий и данных</text>
  
  <line x1="40" y1="170" x2="800" y2="170" stroke="#bdc3c7" stroke-width="1.5" />

