    <rect x="80" y="225" width="100" height="22" rx="3" fill="#c0392b" />
    <text x="90" y="241" fill="#fff" font-size="13">📁 правила/</text>
    
    <line x1="100" y1="247" x2="100" y2="305" stroke="#7f8c8d" stroke-width="1.5" />
    <line x1="100" y1="265" x2="120" y2="265" stroke="#7f8c8d" stroke-width="1.5" />
    <line x1="100" y1="295" x2="120" y2="295" stroke="#7f8c8d" stroke-width="1.5" />
    
    <rect x="120" y="255" width="140" height="20" rx="2" fill="#e67e22" />
    <text x="130" y="270" fill="#fff" font-size="12">📄 стиль-кода.md</text>
    <rect x="120" y="285" width="140" height="20" rx="2" fill="#e67e22" />
    <text x="130" y="300" fill="#fff" font-size="12">📄 тестирование.md</text>
    <rect x="120" y="315" width="160" height="20" rx="2" fill="#e67e22" />
